<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morteza Nosrati | FYRKANT</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: #f4f5f7; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 24px 16px; }
    .card { background: #ffffff; width: 100%; max-width: 380px; border-radius: 20px; padding: 28px 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.06); text-align: center; }
    
    /* بخش هدر شخصی */
    .avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; border: 3px solid #1a365d; margin: 0 auto 14px; display: block; }
    h1 { font-size: 1.3rem; color: #111827; margin-bottom: 4px; font-weight: 700; }
    p.title { font-size: 0.85rem; color: #4b5563; margin-bottom: 18px; line-height: 1.4; }
    
    /* دکمه‌ها */
    .actions { display: flex; flex-direction: column; gap: 10px; }
    .btn { display: flex; align-items: center; justify-content: center; padding: 11px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: background-color 0.2s ease; }
    .btn-vcard { background-color: #0d9488; color: #ffffff; }
    .btn-vcard:hover { background-color: #0f766e; }
    .btn-secondary { background-color: #ffffff; color: #1a365d; border: 1.5px solid #1a365d; }
    .btn-secondary:hover { background-color: #f0f4f8; }
    .btn-primary { background-color: #1a365d; color: #ffffff; }
    .btn-primary:hover { background-color: #152b4a; }

    /* جداکننده شرکتی */
    .company-section { margin-top: 20px; padding-top: 18px; border-top: 1px dashed #e5e7eb; }
    .logo { width: 90px; margin: 0 auto 14px; display: block; border-radius: 8px; }

    /* اطلاعات تماس فوتر */
    .contact-info { margin-top: 22px; border-top: 1px solid #e5e7eb; padding-top: 16px; text-align: left; font-size: 0.82rem; color: #4b5563; line-height: 1.8; }
    .contact-info strong { color: #111827; }
    .contact-info a { color: #1a365d; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    
    <!-- بخش اول: پروفایل فردی مرتضی -->
    <img src="profile.jpg" alt="Morteza Nosrati" class="avatar">
    <h1>Morteza Nosrati</h1>
    <p class="title">Founder & IT Infrastructure Field Engineer<br>On-Site Smart Hands & Network Support</p>

    <div class="actions">
      <a href="contact.vcf" download class="btn btn-vcard">
        Spara kontakt (vCard)
      </a>
      <a href="https://www.linkedin.com/in/morteza-nosrati-304420b4/" target="_blank" class="btn btn-secondary">
        Morteza LinkedIn
      </a>
    </div>

    <!-- بخش دوم: واحد حقوقی و خدمات FYRKANT -->
    <div class="company-section">
      <img src="logo.png" alt="FYRKANT IT & Infrastructure" class="logo">
      <div class="actions">
        <a href="https://www.linkedin.com/company/fyrkant-tech/" target="_blank" class="btn btn-primary">
          FYRKANT LinkedIn
        </a>
        <a href="One-Pager.pdf" target="_blank" class="btn btn-secondary">
          Ladda ner One-Pager (PDF)
        </a>
      </div>
    </div>

    <!-- اطلاعات تماس فوتر (بدون وب‌سایت فیک) -->
    <div class="contact-info">
      <div><strong>Tel:</strong> <a href="tel:+46762264919">+46 76 226 49 19</a></div>
      <div><strong>E-post:</strong> <a href="mailto:MortezaNosrati@fyrkanttech.se">MortezaNosrati@fyrkanttech.se</a></div>
      <div><strong>Plats:</strong> Göteborg & Västra Götaland</div>
    </div>

  </div>
</body>
</html>
